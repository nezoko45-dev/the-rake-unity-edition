name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'WebRake/**'
      - 'Assets/**'
      - '.github/workflows/build-windows-exe.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: WebRake
        run: npm install
      - name: Build portable Windows executable
        working-directory: WebRake
        run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: The-Rake-Unity-Edition-Windows
          path: WebRake/dist/*.exe
          if-no-files-found: error
          retention-days: 30
